<style>

  }
  /* An explicit visitor choice overrides the device preference. */
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="light"] body { --bg: #ffffff; --fg: #111110; --muted: #5e5d58; --rule: #d8d6cf; --red: #d00; }
  html[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }

  .y { color: var(--red); }
  .home:hover span { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }

  /* emblem: drawn on near-white, so it is blended into the page colour */
  .emblem { margin: 4px -20px 36px; }
  .emblem img {

    aspect-ratio: 3 / 1; object-fit: cover; object-position: 50% 58%;

  }
  @media (prefers-color-scheme: dark) {

  /* title and navigation */

  .tagline {

  nav ul { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid var(--rule); }
  nav li { border-top: 1px solid var(--rule); }
  nav a {

  nav a:active { background: color-mix(in srgb, var(--fg) 6%, transparent); }

  nav a:hover .label { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }

  /* footer */

  .theme-choice { display: inline-flex; align-items: center; gap: 9px; }
  .theme-choice button {
    appearance: none; border: 0; background: transparent; color: var(--muted);

  .theme-choice button:hover { color: var(--fg); }
  .theme-choice button:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

  /* wider screens: title left, navigation right */
  @media (min-width: 860px) {

<script>
(function () {
  var root = document.documentElement;
  var buttons = document.querySelectorAll('[data-theme-choice]');
  var themeMetas = document.querySelectorAll('meta[name="theme-color"]');
  var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  function systemTheme() {
    return media && media.matches ? 'dark' : 'light';
  }
  function applyTheme(theme, save) {
    root.setAttribute('data-theme', theme);
    buttons.forEach(function (button) {
      button.setAttribute('aria-pressed', String(button.getAttribute('data-theme-choice') === theme));
    });
    var themeColor = theme === 'dark' ? '#111110' : '#ffffff';
    themeMetas.forEach(function (meta) {
      meta.removeAttribute('media');
      meta.setAttribute('content', themeColor);
    });
    if (save) {
      try { localStorage.setItem('ukraine-at-war-theme', theme); } catch (e) {}
    }
  }

  var savedTheme = null;
  try { savedTheme = localStorage.getItem('ukraine-at-war-theme'); } catch (e) {}
  if (savedTheme === 'dark' || savedTheme === 'light') {
    applyTheme(savedTheme, false);
  } else {
    /* No override: retain the device's automatic light/dark preference. */
    root.removeAttribute('data-theme');
    buttons.forEach(function (button) {
      button.setAttribute('aria-pressed', String(button.getAttribute('data-theme-choice') === systemTheme()));
    });
  }

  buttons.forEach(function (button) {
    button.addEventListener('click', function () {
      applyTheme(button.getAttribute('data-theme-choice'), true);
    });
  });

  if (media && media.addEventListener) {
    media.addEventListener('change', function () {
      var saved = null;
      try { saved = localStorage.getItem('ukraine-at-war-theme'); } catch (e) {}
      if (saved !== 'dark' && saved !== 'light') {
        buttons.forEach(function (button) {
          button.setAttribute('aria-pressed', String(button.getAttribute('data-theme-choice') === systemTheme()));
        });
        themeMetas.forEach(function (meta) {
          meta.setAttribute('content', systemTheme() === 'dark' ? '#111110' : '#ffffff');
        });
      }
    });
  }
})();
</script>
