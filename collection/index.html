<style>
:root {
  --bg: #ffffff;
  --fg: #111110;
  --yellow: #f4d35e;
  --red: #d00;
  --muted: #5e5d58;
  --rule: rgba(17,17,16,.2);
  --serif: Charter,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--bg);
  color-scheme: light;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 17px/1.4 var(--sans);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  padding-bottom: env(safe-area-inset-bottom);
}

a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }

.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding: 0 20px;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  overflow-x: clip;
}

.bar { padding: 14px 0 6px; transform: translateY(3vh); }
main { flex: 1; display: flex; flex-direction: column; justify-content: center; }

.home {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  font-size: 15px;
  letter-spacing: .04em;
}

.y { color: var(--red); }

/* Orbit */

.orbit {
  --size: clamp(300px, min(100vw - 40px, 100svh - 240px), 860px);
  --icon: 48px;
  --R: calc(var(--size) * .36);
  --hub: calc(var(--size) * .17);
  --turn: 240s;
  position: relative;
  width: var(--size);
  height: var(--size);
  margin: 30px auto 40px;
}

/* static dial: scale of 60 ticks, one yellow index at twelve */
.dial {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.track {
  position: absolute;
  left: calc(50% - var(--R));
  top: calc(50% - var(--R));
  width: calc(var(--R) * 2);
  height: calc(var(--R) * 2);
  border: 1px solid var(--fg);
  border-radius: 50%;
}

.ring {
  position: absolute;
  inset: 0;
  animation: turn var(--turn) linear infinite;
  animation-play-state: var(--play, running);
}

.unspin {
  animation: unturn var(--turn) linear infinite;
  animation-play-state: var(--play, running);
}

@keyframes turn { to { transform: rotate(360deg); } }
@keyframes unturn { to { transform: rotate(-360deg); } }

.orbit:has(.item:hover),
.orbit:has(.item:focus-visible) { --play: paused; }

.spoke {
  position: absolute;
  left: 50%;
  width: 1px;
  background: var(--rule);
  --len: calc(var(--R) - var(--hub));
  height: var(--len);
  top: calc(50% - var(--hub) - var(--len));
  transform-origin: 0 calc(var(--hub) + var(--len));
  transform: rotate(var(--a));
}

.node {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 0;
  height: 0;
  transform: rotate(var(--a)) translateY(calc(var(--R) * -1));
}

.upright { transform: rotate(calc(var(--a) * -1)); }

.item {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--icon);
  height: var(--icon);
  transform: translate(-50%,-50%);
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--fg);
  z-index: 2;
  transition: background-color .15s ease;
}

.item:hover,
.item:focus-visible { background: var(--yellow); }

.art {
  display: grid;
  place-items: center;
  width: 62%;
  height: 62%;
}

.art img { display: block; width: 100%; height: 100%; object-fit: contain; }

.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.hub {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  width: calc(var(--hub) * 2);
  text-align: center;
  pointer-events: none;
}

.title {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  transform: translateY(-50%);
  white-space: nowrap;
  font: 400 clamp(20px, calc(var(--size) * .06), 50px)/1.05 var(--serif);
  letter-spacing: -.02em;
}

/* gyroscope: two rings turning on perpendicular axes, never in step */
.gyro {
  position: absolute;
  left: 50%;
  top: 0;
  width: calc(var(--size) * .27);
  height: calc(var(--size) * .27);
  transform: translate(-50%,-50%);
  overflow: visible;
  transition: opacity .15s ease;
}

.gyro ellipse {
  transform-box: fill-box;
  transform-origin: center;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
  animation-direction: alternate;
  animation-play-state: var(--play, running);
}

.r1 { transform: scaleX(.5); animation-name: flipx; animation-duration: 11s; }
.r2 { transform: scaleY(.5); animation-name: flipy; animation-duration: 17s; animation-delay: -6s; }

@keyframes flipx { from { transform: scaleX(1); } to { transform: scaleX(-1); } }
@keyframes flipy { from { transform: scaleY(1); } to { transform: scaleY(-1); } }

.orbit:has(.item:hover) .gyro,
.orbit:has(.item:focus-visible) .gyro { opacity: 0; }

.line {
  position: absolute;
  left: -10%;
  right: -10%;
  top: calc(var(--size) * .045);
  margin: 0;
  text-wrap: balance;
  font-size: 13px;
  line-height: 1.4;
  color: var(--muted);
}

footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 20px;
  padding-bottom: 22px;
  color: var(--muted);
  font-size: 14px;
}

footer a { padding: 10px 0 10px 12px; }

@media(min-width:760px) {
  .wrap { padding: 0 32px; }
  .bar { padding-top: 24px; }
}

@media(orientation:portrait) and (max-width:430px) {
  .orbit { --size: calc(clamp(300px, min(100vw - 40px, 100svh - 240px), 860px) * .95); }
}

@media(orientation:landscape) and (max-height:500px) {
  .orbit {
    --size: clamp(190px, min(100vw - 40px, 100svh - 180px), 420px);
    --icon: clamp(34px, calc(var(--size) * .16), 42px);
    margin: 0 auto;
    transform: translateY(-8%);
  }
  .line { top: calc(var(--size) * .015); }
}

@media(prefers-reduced-motion:reduce) {
  .ring, .unspin, .gyro ellipse { animation: none !important; }
  *, *::before, *::after { transition: none !important; }
  .motion { display: none; }
}

/* Full-screen monowheelers reel */
.reel{position:fixed;inset:0;z-index:50;background:#000;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s;outline:0}
.reel.on{opacity:1;visibility:visible;transition:opacity .25s}
.reel video{display:block;width:100%;height:100%;object-fit:cover;background:#000}
.reel video::-webkit-media-controls,.reel video::-webkit-media-controls-panel,.reel video::-webkit-media-controls-overlay-play-button,.reel video::-webkit-media-controls-start-playback-button{display:none!important;-webkit-appearance:none;opacity:0}

<script>
/* dial: 60 ticks, long every fifth, yellow index at twelve */
(function(){
  var svg = document.getElementById('dial'), NS = 'http://www.w3.org/2000/svg';
  function el(n, a){ var e = document.createElementNS(NS, n); for (var k in a) e.setAttribute(k, a[k]); return e; }
  svg.appendChild(el('circle', {cx: 50, cy: 50, r: 49.6, fill: 'none', stroke: '#111110', 'stroke-width': .25}));
  for (var i = 0; i < 60; i++) {
    var t = i * Math.PI / 30, long = i % 5 === 0, r1 = 49.6, r2 = long ? 45.8 : 47.6;
    var s = Math.sin(t), c = Math.cos(t);
    svg.appendChild(el('line', {
      x1: 50 + r1 * s, y1: 50 - r1 * c, x2: 50 + r2 * s, y2: 50 - r2 * c,
      stroke: '#111110', 'stroke-width': long ? .4 : .2
    }));
  }
  svg.appendChild(el('line', {x1: 50, y1: .4, x2: 50, y2: 5.6, stroke: '#f4d35e', 'stroke-width': 1}));

  /* north */
  var n = el('text', {
    x: 50, y: -2.2, 'text-anchor': 'middle', fill: '#111110',
    'font-size': 3.6, 'font-family': 'Charter,"Iowan Old Style","Palatino Linotype",Georgia,serif'
  });
  n.textContent = 'n';
  svg.appendChild(n);

  /* reticle: four short ticks at the hub edge */
  for (var j = 0; j < 4; j++) {
    var u = j * Math.PI / 2, su = Math.sin(u), cu = Math.cos(u);
    svg.appendChild(el('line', {
      x1: 50 + 15 * su, y1: 50 - 15 * cu, x2: 50 + 19 * su, y2: 50 - 19 * cu,
      stroke: '#111110', 'stroke-width': .25
    }));
  }
})();

/* Icon labels and captions stay hidden. The links retain accessible names. */
</script>

<script>
/* Reel interaction: preserve the ordinary link as a fallback if JavaScript is unavailable. */
(function(){
  var reel=document.getElementById('reel'),v=reel.querySelector('video');
  var mq=window.matchMedia('(orientation: portrait)'),isOpen=false;
  v.muted=true;v.defaultMuted=true;v.playsInline=true;v.controls=false;
  function noop(){}
  function startTime(){return mq.matches&&isFinite(v.duration)?v.duration*.8:0}
  function frame(){
    v.loop=!mq.matches;
    if(mq.matches&&isFinite(v.duration)&&v.duration&&Math.abs(v.currentTime-startTime())>1){
      try{v.currentTime=startTime()}catch(e){}
    }
  }
  function openReel(){
    v.muted=true;isOpen=true;
    reel.classList.add('on');reel.setAttribute('aria-hidden','false');
    var p=v.play();if(p&&p.catch)p.catch(noop);
    frame();history.pushState({reel:1},'','#monowheelers');
  }
  function closeReel(){
    isOpen=false;v.pause();reel.classList.remove('on');reel.setAttribute('aria-hidden','true');window.scrollTo(0,0);
  }
  v.addEventListener('loadedmetadata',function(){if(isOpen)frame()});
  v.addEventListener('ended',function(){if(isOpen&&mq.matches){v.currentTime=startTime();var p=v.play();if(p&&p.catch)p.catch(noop)}});
  if(mq.addEventListener)mq.addEventListener('change',function(){if(isOpen)frame()});
  document.querySelectorAll('[data-reel]').forEach(function(a){
    a.addEventListener('click',function(e){
      if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
      e.preventDefault();openReel();
    });
  });
  window.addEventListener('popstate',function(){if(isOpen)closeReel();window.scrollTo(0,0)});
  window.addEventListener('orientationchange',function(){if(!isOpen)window.scrollTo(0,0)});
  reel.addEventListener('click',function(e){
    if(e.target===v&&v.paused){v.muted=true;var p=v.play();if(p&&p.catch)p.catch(noop);return}
    if(history.state&&history.state.reel)history.back();else closeReel();
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&isOpen)reel.click()});
})();
</script>

      var tInitial=v.currentTime,tSettled=null,playCount=seenPlaying,seekCount=seenSeeked; /* capture before page's click handler */
      snap('tap  ');
      [0,300,1000,2500,5000].forEach(function(ms){later('after tap',ms,function(){log(V()+'  '+R())})});
      after(1500,function(){tSettled=v.currentTime}); /* reading after the portrait seek has had time to land */
      after(5200,function(){
        var tNow=v.currentTime,fromSettled=(tSettled===null)?NaN:(tNow-tSettled),fromInitial=tNow-tInitial;
        var state=(seenPlaying>playCount&&(!v.paused))?((!isNaN(fromSettled)&&fromSettled>=1)||(!isNaN(fromSettled)&&fromSettled<0)?'PLAYING / ADVANCING':'PLAYING EVENT SEEN; POSITION UNCLEAR'):((!v.paused)?'UNPAUSED, NO NEW PLAYING EVENT':'PAUSED / NO PLAYING EVENT');
        log('VERDICT video: '+state+'  t@tap='+tInitial.toFixed(2)+'  t@1.5s='+(tSettled===null?'n/a':tSettled.toFixed(2))+'  t@5.2s='+tNow.toFixed(2)+
          '  advanced(1.5s->5.2s)='+(isNaN(fromSettled)?'n/a':fromSettled.toFixed(2))+'s  advanced(tap->5.2s)='+fromInitial.toFixed(2)+'s  paused='+v.paused+' rs='+v.readyState+' ns='+v.networkState);
        snap('after5s');
      });
    }
  },true);
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(){log(n)},true)});
  document.addEventListener('touchstart',function(e){if(e.touches.length>1)log('multi-touch x'+e.touches.length)},{capture:true,passive:true});

  /* layout lifecycle */
  var vt=0;
  function tick(label){var n=Date.now();if(n-vt<200)return;vt=n;snap(label)}
  addEventListener('resize',function(){tick('resize ')});
  addEventListener('orientationchange',function(){log('orientationchange (reel '+(reel.classList.contains('on')?'OPEN':'closed')+')');[0,300,1000].forEach(function(ms){later('orient',ms,function(){snap('orient')})})});
  addEventListener('popstate',function(){log('popstate');[0,150,600,1500].forEach(function(ms){later('popstate',ms,function(){snap('close? ')})})});
  addEventListener('pageshow',function(){snap('pageshow')});
  addEventListener('scroll',function(){if(scrollX!==0)tick('scrollX!=0')},{passive:true});
  if(window.visualViewport){
    visualViewport.addEventListener('resize',function(){tick('vv.resize')});
    visualViewport.addEventListener('scroll',function(){tick('vv.scroll')});
  }
  new MutationObserver(function(){
    var on=reel.classList.contains('on');log('REEL '+(on?'OPENED':'CLOSED'));
    [0,120,600,1500].forEach(function(ms){later(on?'opened':'closed',ms,function(){snap(on?'open  ':'closed')})});
  }).observe(reel,{attributes:true,attributeFilter:['class']});

  /* UI */
  btn('snap',function(){snap('manual')});
  btn('clear',function(){run++;lines=[];lastClick=0;box.textContent='';log('--- run '+run+' (pending timers from earlier runs cancelled) ---')});
  btn('copy log',function(){
    var txt=lines.join('\n');
    function fb(){var ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){log('copied '+lines.length+' lines')},function(){fb();log('copied (fallback)')});else{fb();log('copied (fallback)')}
  });
  document.body.appendChild(probe);document.body.appendChild(box);document.body.appendChild(bar);
  log('UA '+navigator.userAgent);
  log('standalone='+(navigator.standalone===true||matchMedia('(display-mode: standalone)').matches)+'  SW='+(navigator.serviceWorker&&navigator.serviceWorker.controller?navigator.serviceWorker.controller.scriptURL:'none')+'  dpr='+devicePixelRatio);
  log('--size rule: '+getComputedStyle(orbit).getPropertyValue('--size').replace(/\s+/g,' ').trim()+'  (unresolved text; the resolved value is shown as computed width)');
  log('video initial: '+V());
  snap('load  ');
})();
