<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>abdymok</title>
<meta name="description" content="Murals, photographs, graphics and moving images.">
<meta property="og:title" content="abdymok">
<meta property="og:description" content="Murals, photographs, graphics and moving images.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://abdymok.github.io/collection/">
<meta property="og:image" content="https://abdymok.github.io/40/images/40.jpg">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/mural-180.png">
<style>
:root{--bg:#fff;--fg:#111110;--muted:#5e5d58;--rule:#d8d6cf;--red:#d00;--serif:Charter,"Iowan Old Style","Palatino Linotype",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#111110;--fg:#ecebe6;--muted:#a2a19a;--rule:#34342f;--red:#ff4a3d}}
html[data-theme="light"]{color-scheme:light}html[data-theme="light"] body{--bg:#fff;--fg:#111110;--muted:#5e5d58;--rule:#d8d6cf;--red:#d00}
html[data-theme="dark"]{color-scheme:dark}html[data-theme="dark"] body{--bg:#111110;--fg:#ecebe6;--muted:#a2a19a;--rule:#34342f;--red:#ff4a3d}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.4 var(--sans);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible{outline:2px solid currentColor;outline-offset:4px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px;min-height:100svh;display:flex;flex-direction:column;overflow-x:clip}.bar{padding:14px 0 6px}
main{flex:1;display:flex;flex-direction:column;justify-content:center}
.home{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-size:15px;letter-spacing:.04em}.y{color:var(--red)}
.caption{font-size:14px;color:var(--muted);margin:0}

/* the orbit */
.orbit{
  --size:clamp(300px,min(100vw - 40px,100svh - 250px),820px);
  --R:calc(var(--size)/2 - 76px);
  --turn:60s;
  position:relative;width:var(--size);height:var(--size);margin:6px auto 64px;
}
.track{position:absolute;left:calc(50% - var(--R));top:calc(50% - var(--R));width:calc(var(--R)*2);height:calc(var(--R)*2);border:1px solid var(--rule);border-radius:50%}
.ring{position:absolute;inset:0;animation:turn var(--turn) linear infinite;animation-play-state:var(--play,running)}
.unspin{animation:unturn var(--turn) linear infinite;animation-play-state:var(--play,running)}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes unturn{to{transform:rotate(-360deg)}}
.orbit:has(.item:hover),.orbit:has(.item:focus-visible){--play:paused}
html.still .orbit{--play:paused}

.spoke{position:absolute;left:50%;width:1px;background:var(--rule);
  --len:var(--R);
  height:var(--len);top:calc(50% - var(--len));
  transform-origin:0 var(--len);transform:rotate(var(--a))}
.node{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a)) translateY(calc(var(--R)*-1))}
.upright{transform:rotate(calc(var(--a)*-1))}
.item{position:absolute;left:0;top:0;width:max-content;transform:translate(-50%,-50%);display:block}
.label{display:block;text-align:center;white-space:nowrap;line-height:1.15;background:var(--bg);padding:4px 8px}
.title{display:block;font:400 clamp(17px,calc(var(--size)*.03),24px)/1.15 var(--serif)}
.item:hover .title,.item:focus-visible .title{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px;padding-bottom:22px;color:var(--muted);font-size:14px}
footer a{padding:10px 0 10px 12px}.theme-choice{display:inline-flex;gap:10px;align-items:center}
.theme-choice button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;text-underline-offset:4px;min-height:44px;min-width:44px;padding:12px 8px}
.theme-choice button[aria-pressed="true"]{color:var(--fg);text-decoration:underline}
.theme-choice .sep{width:1px;height:14px;background:var(--rule)}
@media(min-width:760px){.wrap{padding:0 32px}.bar{padding-top:24px}footer{margin-top:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.theme-choice .sep,[data-motion]{display:none}}
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-S3ZLJ9QQWD"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-S3ZLJ9QQWD');</script>
</head>
<body>
<div class="wrap">
<header class="bar"><a class="home" href="/" aria-label="Back to ukraine@war landing page"><span>abd<span class="y">y</span>mok</span></a></header>
<main>
<div class="orbit" id="orbit">
  <div class="track" aria-hidden="true"></div>
  <div class="ring">
    <i class="spoke" style="--a:0deg" aria-hidden="true"></i>
    <i class="spoke" style="--a:60deg" aria-hidden="true"></i>
    <i class="spoke" style="--a:120deg" aria-hidden="true"></i>
    <i class="spoke" style="--a:180deg" aria-hidden="true"></i>
    <i class="spoke" style="--a:240deg" aria-hidden="true"></i>
    <i class="spoke" style="--a:300deg" aria-hidden="true"></i>

    <div class="node" style="--a:0deg"><div class="unspin"><div class="upright">
      <a class="item" href="/mural/balcony/" data-caption="A view from the city, not above it."><span class="label"><span class="title">balcony</span></span><span class="sr">A view from the city, not above it.</span></a>
    </div></div></div>

    <div class="node" style="--a:60deg"><div class="unspin"><div class="upright">
      <a class="item" href="/40/dnipro/" data-caption="Somewhere behind the mist is the city."><span class="label"><span class="title">dnipro</span></span><span class="sr">Somewhere behind the mist is the city.</span></a>
    </div></div></div>

    <div class="node" style="--a:120deg"><div class="unspin"><div class="upright">
      <a class="item" href="/40/" data-caption="The forty-box archive."><span class="label"><span class="title">40</span></span><span class="sr">The forty-box archive.</span></a>
    </div></div></div>

    <div class="node" style="--a:180deg"><div class="unspin"><div class="upright">
      <a class="item" href="/mural/" data-caption="The living wall."><span class="label"><span class="title">67</span></span><span class="sr">The living wall.</span></a>
    </div></div></div>

    <div class="node" style="--a:240deg"><div class="unspin"><div class="upright">
      <a class="item" href="/collection/20/" data-caption="A small number with a longer story."><span class="label"><span class="title">20</span></span><span class="sr">A small number with a longer story.</span></a>
    </div></div></div>

    <div class="node" style="--a:300deg"><div class="unspin"><div class="upright">
      <a class="item" href="/40/running/" data-caption="Kyiv · Dnipro"><span class="label"><span class="title">monowheelers</span></span><span class="sr">Kyiv · Dnipro</span></a>
    </div></div></div>
  </div>

</div>
</main>
<footer><span aria-hidden="true">Kyiv</span><div class="theme-choice" role="group" aria-label="Page background and motion"><button type="button" data-theme-choice="dark" aria-pressed="false">black</button><button type="button" data-theme-choice="light" aria-pressed="false">white</button><span class="sep" aria-hidden="true"></span><button type="button" data-motion aria-pressed="false">still</button></div><a href="https://abdymok.substack.com">Substack</a></footer>
</div>
<script>
(function(){var root=document.documentElement,buttons=document.querySelectorAll('[data-theme-choice]'),metas=document.querySelectorAll('meta[name="theme-color"]'),media=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;function systemTheme(){return media&&media.matches?'dark':'light'}function applyTheme(theme,save){root.setAttribute('data-theme',theme);buttons.forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-theme-choice')===theme))});var c=theme==='dark'?'#111110':'#ffffff';metas.forEach(function(m){m.removeAttribute('media');m.setAttribute('content',c)});if(save){try{localStorage.setItem('ukraine-at-war-theme',theme)}catch(e){}}}var saved=null;try{saved=localStorage.getItem('ukraine-at-war-theme')}catch(e){}if(saved==='dark'||saved==='light'){applyTheme(saved,false)}else{buttons.forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-theme-choice')===systemTheme()))})}buttons.forEach(function(b){b.addEventListener('click',function(){applyTheme(b.getAttribute('data-theme-choice'),true)})});if(media&&media.addEventListener){media.addEventListener('change',function(){var s=null;try{s=localStorage.getItem('ukraine-at-war-theme')}catch(e){}if(s!=='dark'&&s!=='light'){buttons.forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-theme-choice')===systemTheme()))});metas.forEach(function(m){m.setAttribute('content',systemTheme()==='dark'?'#111110':'#ffffff')})}})}})();

/* still/turn switch */
(function(){
  var m=document.querySelector('[data-motion]');
  m.addEventListener('click',function(){
    var s=document.documentElement.classList.toggle('still');
    m.setAttribute('aria-pressed',String(s));m.textContent=s?'turn':'still';
  });
})();
</script>
</body>
</html>
