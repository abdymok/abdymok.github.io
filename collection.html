<style>
:root {
  --blue: #2459c4;
  --disc: #102c70;
  --yellow: #f4d35e;
  --fg: #fff;
  --muted: #c5d2f2;
  --rule: rgba(255,255,255,.32);
  --serif: Charter,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--blue);
  color-scheme: light;
}

body {
  margin: 0;
  background: var(--blue);
  color: var(--fg);
  font: 17px/1.4 var(--sans);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  padding-bottom: env(safe-area-inset-bottom);
}

a {
  color: inherit;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}

a:focus-visible, button:focus-visible {
  outline: 2px solid var(--yellow);
  outline-offset: 4px;
}

.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding: 0 20px;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  overflow-x: clip;
}

.bar { padding: 14px 0 6px; }

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.home {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  font-size: 15px;
  letter-spacing: .04em;
}

.y { color: var(--yellow); }

.caption {
  font-size: 14px;
  color: var(--muted);
  margin: 0;
}

/* Orbit */

.orbit {
  --size: clamp(300px, min(100vw - 40px, 100svh - 250px), 820px);
  --icon: 44px;
  --R: calc(var(--size) * .39);
  --hub: calc(var(--size) * .19);
  --turn: 240s;
  position: relative;
  width: var(--size);
  height: var(--size);
  margin: 6px auto 64px;
  border-radius: 50%;
  background: var(--disc);
  border: 1px solid var(--yellow);
}

.track {
  position: absolute;
  left: calc(50% - var(--R));
  top: calc(50% - var(--R));
  width: calc(var(--R) * 2);
  height: calc(var(--R) * 2);
  border: 1px solid var(--rule);
  border-radius: 50%;
}

.ring {
  position: absolute;
  inset: 0;
  animation: turn var(--turn) linear infinite;
  animation-play-state: var(--play, running);
}

.unspin {
  animation: unturn var(--turn) linear infinite;
  animation-play-state: var(--play, running);
}

@keyframes turn { to { transform: rotate(360deg); } }
@keyframes unturn { to { transform: rotate(-360deg); } }

.orbit:has(.item:hover),
.orbit:has(.item:focus-visible) {
  --play: paused;
}

html.still .orbit { --play: paused; }

.spoke {
  position: absolute;
  left: 50%;
  width: 1px;
  background: var(--rule);
  --len: calc(var(--R) - var(--hub));
  height: var(--len);
  top: calc(50% - var(--hub) - var(--len));
  transform-origin: 0 calc(var(--hub) + var(--len));
  transform: rotate(var(--a));
}

.node {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 0;
  height: 0;
  transform: rotate(var(--a)) translateY(calc(var(--R) * -1));
}

.upright { transform: rotate(calc(var(--a) * -1)); }

.item {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--icon);
  height: var(--icon);
  transform: translate(-50%,-50%);
  display: grid;
  place-items: center;
  border-radius: 50%;
  z-index: 2;
}

.art {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  transition: opacity .2s ease, transform .2s ease;
}

.art img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.item:hover .art,
.item:focus-visible .art {
  opacity: .72;
  transform: scale(1.12);
}

.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.hub {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  width: calc(var(--hub) * 2);
  text-align: center;
  pointer-events: none;
}

h1 {
  margin: 0;
  font: 400 clamp(24px,calc(var(--size) * .055),42px)/1.1 var(--serif);
  letter-spacing: -.015em;
}

.line {
  margin: 8px 0 0;
  min-height: 2.8em;
  text-wrap: balance;
  font-size: 13px;
  line-height: 1.4;
  color: var(--muted);
}

.note {
  max-width: 34em;
  margin: -22px auto 0;
  text-align: center;
  padding: 0 4px;
}

footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 28px;
  padding-bottom: 22px;
  color: var(--muted);
  font-size: 14px;
}

footer a { padding: 10px 0 10px 12px; }

.motion {
  appearance: none;
  border: 1px solid var(--rule);
  border-radius: 50px;
  background: transparent;
  color: var(--fg);
  font: inherit;
  font-size: 14px;
  cursor: pointer;
  min-height: 44px;
  min-width: 64px;
  padding: 8px 14px;
}

.motion[aria-pressed="true"] {
  border-color: var(--yellow);
  color: var(--yellow);
}

@media(min-width:760px) {
  .wrap { padding: 0 32px; }
  .bar { padding-top: 24px; }
  footer { margin-top: 20px; }
}

@media(prefers-reduced-motion:reduce) {
  .ring, .unspin { animation: none !important; }
  *, *::before, *::after { transition: none !important; }
}

<body>
<div class="wrap">
<header class="bar">
  <a class="home" href="/" aria-label="Back to ukraine at war landing page">
    <span>abd<span class="y">y</span>mok</span>
  </a>
</header>

<main>
<div class="orbit" id="orbit">
  <div class="track" aria-hidden="true"></div>
  <div class="ring">
    <i class="spoke" style="--a:0deg" aria-hidden="true"></i>
    <i class="spoke" style="--a:60deg" aria-hidden="true"></i>
    <i class="spoke" style="--a:120deg" aria-hidden="true"></i>
    <i class="spoke" style="--a:180deg" aria-hidden="true"></i>
    <i class="spoke" style="--a:240deg" aria-hidden="true"></i>
    <i class="spoke" style="--a:300deg" aria-hidden="true"></i>

    <div class="node" style="--a:0deg">
      <div class="unspin"><div class="upright">
        <a class="item" href="/mural/balcony/" data-caption="A view from the city, not above it." aria-label="balcony">
          <span class="art"><img src="/orbit-icons/balcony-inner.svg" alt=""></span>
          <span class="sr">A view from the city, not above it.</span>
        </a>
      </div></div>
    </div>

    <div class="node" style="--a:60deg">
      <div class="unspin"><div class="upright">
        <a class="item" href="/40/dnipro/" data-caption="Somewhere behind the mist is the city." aria-label="dnipro">
          <span class="art"><img src="/orbit-icons/dnipro-inner.svg" alt=""></span>
          <span class="sr">Somewhere behind the mist is the city.</span>
        </a>
      </div></div>
    </div>

    <div class="node" style="--a:120deg">
      <div class="unspin"><div class="upright">
        <a class="item" href="/40/" data-caption="The forty-box archive." aria-label="40">
          <span class="art"><img src="/orbit-icons/40-inner.svg" alt=""></span>
          <span class="sr">The forty-box archive.</span>
        </a>
      </div></div>
    </div>

    <div class="node" style="--a:180deg">
      <div class="unspin"><div class="upright">
        <a class="item" href="/mural/" data-caption="The living wall." aria-label="67">
          <span class="art"><img src="/orbit-icons/67-inner.svg" alt=""></span>
          <span class="sr">The living wall.</span>
        </a>
      </div></div>
    </div>

    <div class="node" style="--a:240deg">
      <div class="unspin"><div class="upright">
        <a class="item" href="/collection/20/" data-caption="A small number with a longer story." aria-label="20">
          <span class="art"><img src="/orbit-icons/20-inner.svg" alt=""></span>
          <span class="sr">A small number with a longer story.</span>
        </a>
      </div></div>
    </div>

    <div class="node" style="--a:300deg">
      <div class="unspin"><div class="upright">
        <a class="item" href="/40/running/" data-caption="Kyiv · Dnipro" aria-label="monowheelers">
          <span class="art"><img src="/orbit-icons/monowheelers-inner.svg" alt=""></span>
          <span class="sr">Kyiv · Dnipro</span>
        </a>
      </div></div>
    </div>
  </div>

  <div class="hub">
    <h1>collection</h1>
    <p class="line" id="line" aria-live="polite">Kyiv</p>
  </div>
</div>

<p class="caption note">A small collection of murals, photographs, graphics and moving images from Kyiv.</p>
</main>

<footer>
  <span aria-hidden="true">Kyiv</span>
  <button class="motion" type="button" data-motion aria-pressed="false">still</button>
  <a href="https://abdymok.substack.com">Substack</a>
</footer>
</div>

<script>
(function(){
  var line = document.getElementById('line');
  var base = line.textContent;

  document.querySelectorAll('.item').forEach(function(a){
    function on(){
      line.textContent = a.getAttribute('data-caption') || base;
    }
    function off(){
      line.textContent = base;
    }
    a.addEventListener('mouseenter', on);
    a.addEventListener('focus', on);
    a.addEventListener('mouseleave', off);
    a.addEventListener('blur', off);
  });

  var button = document.querySelector('[data-motion]');
  button.addEventListener('click', function(){
    var still = document.documentElement.classList.toggle('still');
    button.setAttribute('aria-pressed', String(still));
    button.textContent = still ? 'turn' : 'still';
  });
})();
</script>
